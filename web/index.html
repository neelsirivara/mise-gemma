<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mise</title>
  <meta name="theme-color" content="#0f1115" />
  <meta name="description" content="Hands-free kitchen copilot. Gemma 4 runs on your own laptop; nothing goes to the cloud." />
  <!-- installable on iPhone: Share → Add to Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mise" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="logo" id="logo">●</span>
      <div>
        <h1 id="appName">Mise</h1>
        <p id="tagline"></p>
      </div>
    </div>
    <div class="badges">
      <span class="pill" id="netPill" title="Browser network status">checking…</span>
      <span class="pill model" id="talkPill" title="Conversation model">talk: connecting…</span>
      <span class="pill model" id="watchPill" title="Vision loop model">watch: …</span>
      <button class="pill hubBtn" id="hubBtn" title="Which laptop runs the models">⚙ hub</button>
    </div>
  </header>

  <dialog id="hubDialog">
    <form method="dialog" class="hubForm">
      <h2>Connect to your Mise hub</h2>
      <p>The models run on your laptop. Enter the address that <b>run.cmd -Phone</b> printed, for example
        <code>https://172.20.10.2:8443</code>. Leave it empty to use this page's own server.</p>
      <input id="hubInput" placeholder="https://<laptop-ip>:8443" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <div class="hubRow">
        <button value="cancel" class="ghost">Cancel</button>
        <button value="save" id="hubSave">Connect</button>
      </div>
    </form>
  </dialog>

  <main>
    <section class="left">
      <div class="cam" id="camWrap">
        <video id="video" autoplay playsinline muted></video>
        <img id="still" alt="" hidden />
        <div class="cam-caption" id="caption">camera starting…</div>
        <div class="alert" id="alert" hidden></div>
        <div class="listening" id="listening" hidden>● listening</div>
      </div>
      <div class="controls">
        <button id="micBtn" class="mic" title="Hold to talk (or hold Space)">🎙️<span>Hold to talk</span></button>
        <div class="toggles">
          <label><input type="checkbox" id="handsFree" /> Hands-free</label>
          <label><input type="checkbox" id="watchToggle" /> Watch</label>
          <label><input type="checkbox" id="speakToggle" checked /> Speak</label>
          <label><input type="checkbox" id="frameToggle" checked /> Send frame</label>
        </div>
        <div class="toggles small">
          <select id="camSelect" title="Camera"></select>
          <label class="file">🖼️ Use image<input type="file" id="fileInput" accept="image/*" hidden /></label>
          <button id="liveBtn" class="ghost" hidden>Back to live</button>
          <button id="resetBtn" class="ghost">Reset</button>
        </div>
      </div>
      <div class="metrics" id="metrics"></div>
    </section>

    <section class="right">
      <div id="panels"></div>
      <div id="timers"></div>
      <div class="chat" id="chat"></div>
      <div class="quick" id="quick"></div>
      <form id="form" class="ask">
        <input id="text" autocomplete="off" placeholder="Type, or hold Space to talk…" />
        <button>Send</button>
      </form>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
