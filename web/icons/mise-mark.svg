  <rect x="14" y="300" width="100" height="58" rx="29" fill="none" stroke="#3e5a47" stroke-width="26"/>
  <rect x="526" y="300" width="100" height="58" rx="29" fill="none" stroke="#3e5a47" stroke-width="26"/>
  <!-- pot -->
  <path d="M74 300 Q320 326 566 300 L550 420 Q540 490 462 492 L178 492 Q100 490 90 420 Z" fill="#3e5a47"/>
