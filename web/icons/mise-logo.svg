<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mise app icon: a coral pot with a lemon lid on sunlit mint tiles; the steam curls into a heart.
       Full-bleed square: iOS and Android round the corners themselves. Content stays inside the
       maskable safe zone (the middle 80%). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f1e4"/>
      <stop offset="1" stop-color="#c7dfc9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.92" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#fff1b8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff1b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a47e"/>
      <stop offset="1" stop-color="#ea7f55"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#tile)"/>
  <g stroke="#fffcf0" stroke-width="10" opacity="0.85">
    <path d="M256 0V1024M512 0V1024M768 0V1024M0 256H1024M0 512H1024M0 768H1024"/>
  </g>
  <rect width="1024" height="1024" fill="url(#sun)"/>
  <path d="M120 1024 L520 0 H660 L260 1024 Z" fill="#ffffff" opacity="0.16"/>

  <g transform="translate(512 520) scale(1.18) translate(-512 -520)">
  <!-- shadow -->
  <ellipse cx="512" cy="812" rx="270" ry="40" fill="#1f3326" opacity="0.16"/>

  <!-- steam: two curls and a heart -->
  <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 372 q-34 -44 0 -88 q34 -44 0 -88"/>
    <path d="M652 372 q34 -44 0 -88 q-34 -44 0 -88"/>
  </g>
  <path d="M512 352 C 470 316, 418 286, 418 238 C 418 204, 446 182, 474 182 C 494 182, 506 194, 512 208 C 518 194, 530 182, 550 182 C 578 182, 606 204, 606 238 C 606 286, 554 316, 512 352 Z"
        fill="#f2c7cf" stroke="#3b2a22" stroke-width="16" stroke-linejoin="round"/>

  <!-- handles -->
  <rect x="196" y="520" width="96" height="48" rx="24" fill="#6b4a3a" stroke="#3b2a22" stroke-width="18"/>
  <rect x="732" y="520" width="96" height="48" rx="24" fill="#6b4a3a" stroke="#3b2a22" stroke-width="18"/>
  <!-- pot -->
  <path d="M262 476 H762 L742 732 Q512 790 282 732 Z" fill="url(#pot)" stroke="#3b2a22" stroke-width="20" stroke-linejoin="round"/>
  <path d="M300 560 Q512 600 724 560" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" opacity="0.55"/>
  <!-- lid -->
  <path d="M236 482 Q512 362 788 482 Z" fill="#f6d54a" stroke="#3b2a22" stroke-width="20" stroke-linejoin="round"/>
  <circle cx="512" cy="404" r="30" fill="#6b4a3a" stroke="#3b2a22" stroke-width="16"/>
  <!-- leaf on the knob -->
  <path d="M520 380 Q560 330 616 338 Q600 392 536 396 Z" fill="#5e8c61" stroke="#3b2a22" stroke-width="14" stroke-linejoin="round"/>
  </g>
</svg>
