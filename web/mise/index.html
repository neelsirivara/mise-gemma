<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mise</title>
  <meta name="description" content="Offline sous-chef: photograph your cupboard, cook step by step by voice, and improve the recipe every time." />
  <meta name="theme-color" content="#dcebdd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mise" />
  <link rel="manifest" href="/mise/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/mise/mise.css" />
</head>
<body>
  <header class="top">
    <div class="top-in">
      <button class="brand" id="homeBtn" aria-label="Mise home"><span class="brand-mark" aria-hidden="true"></span>Mise</button>
      <nav class="nav" aria-label="Main">
        <button data-go="pantry" id="navPantry">What can I cook?</button>
        <button data-go="home" id="navBook">Recipe book</button>
      </nav>
      <div class="status">
        <button class="hub-dot" id="hubPill" data-state="warm" aria-label="Connecting to the Mise hub" title="Connecting to the Mise hub"><span aria-hidden="true"></span></button>
      </div>
    </div>
  </header>

  <main id="app" class="shell" tabindex="-1">
    <p class="loading">Starting Mise…</p>
  </main>

  <dialog id="hubDialog" class="sheet">
    <form method="dialog" class="sheet-in">
      <h2>Where should Gemma run?</h2>
      <div class="engine-pick" role="group" aria-label="Where Gemma runs">
        <button type="button" class="btn" id="engLaptop">On my laptop</button>
        <button type="button" class="btn" id="engPhone">On this phone</button>
      </div>
      <p class="muted small" id="engNote"></p>
      <div class="stack" id="hubFields">
      <p>Enter the laptop's address from its Mise Hub page, like
        <code>https://172.20.10.2:8443</code>. Leave it empty to use this page's own server.</p>
      <label for="hubInput" class="label">Hub address</label>
      <input id="hubInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://<laptop-ip>:8443" />
      </div>
      <div class="row end">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="save" class="btn primary" id="hubSave">Connect</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/mise/js/main.js"></script>
</body>
</html>
