<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Mise</title>
  <meta name="description" content="Offline sous-chef: photograph your cupboard, cook step by step by voice, and improve the recipe every time." />
  <meta name="theme-color" content="#dcebdd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mise" />
  <link rel="manifest" href="/mise/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/favicon.png" />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/mise/mise.css" />
</head>
<body>
  <header class="top">
    <div class="top-in">
      <button class="brand" id="homeBtn" aria-label="Mise home"><img class="brand-mark" src="/icons/mise-mark.svg" alt="" aria-hidden="true" />Mise</button>
      <nav class="nav" aria-label="Main">
        <button data-go="pantry" id="navPantry">What can I cook?</button>
        <button data-go="home" id="navBook">Recipe book</button>
      </nav>
      <div class="status">
        <button class="hub-dot" id="hubPill" data-state="warm" aria-label="Connecting to the Mise hub" title="Connecting to the Mise hub"><span aria-hidden="true"></span></button>
      </div>
    </div>
  </header>

  <main id="app" class="shell" tabindex="-1">
    <p class="loading">Starting Mise…</p>
  </main>

  <!-- phone: iOS-style tab bar (the top nav is used on wider screens) -->
  <nav class="tabbar" aria-label="Main">
    <button data-go="pantry"><svg viewBox="0 0 28 28" aria-hidden="true"><rect class="fill" x="6.5" y="2.5" width="15" height="23" rx="3.5"/><path d="M10 2.5h8a3.5 3.5 0 0 1 3.5 3.5v16a3.5 3.5 0 0 1-3.5 3.5h-8A3.5 3.5 0 0 1 6.5 22V6A3.5 3.5 0 0 1 10 2.5ZM6.5 11h15M10 5.8v2.6M10 14v4.2"/></svg><span>What to cook</span></button>
    <button data-go="home"><svg viewBox="0 0 28 28" aria-hidden="true"><path class="fill" d="M6 4.5A2.5 2.5 0 0 1 8.5 2h13.5v20H8.5A2.5 2.5 0 0 0 6 24.5Z"/><path d="M6 24.5V4.5A2.5 2.5 0 0 1 8.5 2h13.5v20M6 24.5A2.5 2.5 0 0 1 8.5 22H22v4H8.5A2.5 2.5 0 0 1 6 24.5ZM11 7.5h6.5M11 11h4.5"/><path d="M17.5 2v7l1.75-1.4L21 9V2" class="ribbon"/></svg><span>Recipes</span></button>
  </nav>

  <dialog id="hubDialog" class="sheet">
    <form method="dialog" class="sheet-in">
      <h2>Where should Gemma run?</h2>
      <div class="engine-pick" role="group" aria-label="Where Gemma runs">
        <button type="button" class="btn" id="engLaptop">On my laptop</button>
        <button type="button" class="btn" id="engPhone">On this phone</button>
      </div>
      <p class="muted small" id="engNote"></p>
      <div class="stack" id="hubFields">
      <p>Enter the laptop's address from its Mise Hub page, like
        <code>https://172.20.10.2:8443</code>. Leave it empty to use this page's own server.</p>
      <label for="hubInput" class="label">Hub address</label>
      <input id="hubInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://<laptop-ip>:8443" />
      </div>
      <div class="row end">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="save" class="btn primary" id="hubSave">Connect</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/mise/js/main.js"></script>
</body>
</html>
